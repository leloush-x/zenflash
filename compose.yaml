services:
  zenflash-llm:
    image: ghcr.io/leloush-x/zenflash:${ZENFLASHLLM_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /var/lib/zenflash-llm/config.json
      CONFIG_SEED_PATH: /run/config/zenflash-llm.json
      # Empty defers to the listen addresses in config.json. Export
      # ZENFLASHLLM_LISTEN / ZENFLASHLLM_WEBUI_LISTEN to override them.
      LISTEN_ADDRESS: ${ZENFLASHLLM_LISTEN:-}
      WEBUI_LISTEN_ADDRESS: ${ZENFLASHLLM_WEBUI_LISTEN:-}
      # Empty DATABASE_URL keeps file-backed state. Set it in a local .env
      # file (uncommitted) or shell export to mirror state into Postgres.
      DATABASE_URL: ${DATABASE_URL:-}
      WEBUI_USERNAME: ${WEBUI_USERNAME:-}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
    # Only the gateway port is published. The embedded Cline proxy (3457) and the
    # dedicated admin listener (8081, if configured to differ) stay internal.
    ports:
      - "${ZENFLASHLLM_PORT:-8080}:8080"
    configs:
      - source: zenflash-llm_config
        target: /run/config/zenflash-llm.json
    volumes:
      - zenflash-llm-state:/var/lib/zenflash-llm
    tmpfs:
      - /tmp

configs:
  zenflash-llm_config:
    file: ./config.json

volumes:
  zenflash-llm-state:
